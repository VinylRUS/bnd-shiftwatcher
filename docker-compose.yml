# Табель — запуск через Docker Compose.
#
#   docker compose up -d --build     # собрать и запустить
#   docker compose logs -f           # смотреть логи
#   docker compose down              # остановить (данные останутся в томе)
#   docker compose build --no-cache  # пересборка с нуля
#
# Данные (SQLite) лежат в именованном томе tabel-data и переживают
# пересоздание контейнера и обновление образа.
#
# На bothost этот файл не используется (платформа запускает образ сама,
# база при этом ложится в /app/data — персистентную папку платформы).

services:
  tabel:
    build: .
    image: tabel:latest
    container_name: tabel
    restart: unless-stopped
    ports:
      - "3000:3000" # слева — порт на сервере (можно сменить на 8080:3000)
    environment:
      # DATABASE_URL не задаём: точка входа сама выберет путь к базе
      # (том /data → рядом с приложением). При необходимости можно задать
      # явно, например:
      # DATABASE_URL: file:/data/tabel.db
      # PORT: 3000
    volumes:
      - tabel-data:/data

volumes:
  tabel-data:
